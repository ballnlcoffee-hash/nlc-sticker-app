  const list = getSettings().staffUsers||[];
  wrap.innerHTML = list.length===0
    ? `<div class="subtle">ยังไม่มีรายชื่อผู้ใช้งาน — เพิ่มชื่อพนักงานด้านบนเพื่อเริ่มใช้งาน</div>`
    : list.map(n=>`<span class="user-chip">${esc(n)}<button type="button" data-remove-user="${esc(n)}" title="ลบออกจากทะเบียน">${icon('close',12)}</button></span>`).join('');
  wrap.querySelectorAll('[data-remove-user]').forEach(b=> b.addEventListener('click', async ()=>{
    const name = b.dataset.removeUser;
    const ok = await confirmDialog('ลบผู้ใช้งาน', `ต้องการลบ "${name}" ออกจากทะเบียนผู้ใช้งานหรือไม่?`);
    if(!ok) return;
    const list = (getSettings().staffUsers||[]).filter(n=>n!==name);
    await saveSettings({staffUsers:list});
    try{ if(localStorage.getItem('nlc_sticker_username')===name) localStorage.removeItem('nlc_sticker_username'); }catch(e){}
    renderUserList();
    renderUserSelect();
    toast('ลบผู้ใช้งานแล้ว');
  }));
}
async function importCatalog(){
  const settings = getSettings();
  let added = 0, skipped = 0;
  for(const c of CATALOG){
    const exists = cache.stickers.some(x=> x.code===c.code && x.name===c.name);
    if(exists){ skipped++; continue; }
    await addDoc('stickers', {
      name:c.name, code:c.code, sizeCm:c.sizeCm, piecesPerSheet:c.piecesPerSheet, unit:'ดวง',
      reorderPoint: c.piecesPerSheet, pricePerSheet: settings.pricePerSheet,
      supplier: settings.printerName, note:'', active:true, createdAt: nowIso(),
    });
    added++;
  }
  await saveSettings({catalogImported:true});
  toast(`นำเข้าแล้ว ${added} รายการใหม่ (ข้าม ${skipped} รายการที่มีอยู่แล้ว)`);
  renderSettings();
}
async function importOldStickerData(){
  if(localMode || !dbApi){ toast('ต้องเชื่อมต่อฐานข้อมูลก่อนจึงจะนำเข้าข้อมูลได้'); return; }
  const btn = document.getElementById('importOldDataBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'กำลังนำเข้า...'; }
  const existingIds = new Set(cache.stickers.map(x=>x.id));
  let added = 0, skipped = 0, failed = 0;
  for(const item of OLD_STICKERS_BACKUP){
    const {_id, ...data} = item;
    if(existingIds.has(_id)){ skipped++; continue; }
    try{
      await dbApi.collection('stickers').doc(_id).set(data);
      added++;
    }catch(e){
      console.error('import failed for', _id, e);
      failed++;
    }
  }
  toast(`นำเข้าจากระบบเดิมแล้ว ${added} รายการ (ข้าม ${skipped} รายการที่มีอยู่แล้ว${failed?`, ล้มเหลว ${failed} รายการ`:''})`);
  renderSettings();
}
/* =========================================================
   PRINTING
========================================================= */
function buildDocPrintHtml(kind, doc){
  const settings = getSettings();
  const titleMap = {receipt:'ใบรับสติ๊กเกอร์', requisition:'ใบเบิกสติ๊กเกอร์', return:'ใบคืนสติ๊กเกอร์', po:'ใบสั่งซื้อสติ๊กเกอร์'};
  const items = doc.items||[];
  let metaHtml = '';
  let tableHtml = '';
  let totalHtml = '';
  let signLabels = ['ผู้จัดทำ','ผู้ตรวจสอบ','ผู้อนุมัติ'];
  const unitLabel = it => it.unit==='SHEET' ? `${num(it.enteredQty)} แผ่น (=${num(it.qty)} ดวง)` : `${num(it.enteredQty??it.qty)} ดวง`;

  if(kind==='receipt'){
    metaHtml = `<div>เลขที่: <b>${esc(doc.docNo)}</b></div><div>วันที่: ${thaiDate(doc.date)}</div><div>ผู้จำหน่าย: ${esc(doc.supplier||'-')}</div><div>ผู้รับของ: ${esc(doc.receivedBy||'-')}</div>${doc.poRef?`<div>อ้างอิงใบสั่งซื้อ: ${esc(doc.poRef)}</div>`:''}`;
    tableHtml = `<table class="print-table"><thead><tr><th>#</th><th>รหัส</th><th>รายการ</th><th>จำนวนที่รับ</th></tr></thead><tbody>
      ${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.code||'')}</td><td>${esc(it.name)}</td><td>${unitLabel(it)}</td></tr>`).join('')}
    </tbody></table>
    <div class="print-subtotal">รวม ${items.length} รายการ — เอกสารนี้บันทึกเฉพาะจำนวนที่รับเข้า ไม่มีราคา</div>`;
    signLabels = ['ผู้ส่งของ','ผู้ตรวจนับ','ผู้รับของ'];
  } else if(kind==='requisition'){
    metaHtml = `<div>เลขที่: <b>${esc(doc.docNo)}</b></div><div>วันที่: ${thaiDate(doc.date)}</div><div>ผู้เบิก: ${esc(doc.issuedBy||'-')}</div>${doc.kind==='extra'?`<div>ประเภท: เบิกเพิ่มพิเศษ (เนื่องจากเบิกขาด)${doc.refDocNo?` — อ้างอิงใบเบิก ${esc(doc.refDocNo)}`:''}</div>`:''}`;
    tableHtml = `<table class="print-table"><thead><tr><th>#</th><th>รหัส</th><th>รายการ</th><th>จำนวนที่เบิก</th></tr></thead><tbody>
      ${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.code||'')}</td><td>${esc(it.name)}</td><td>${unitLabel(it)}</td></tr>`).join('')}
    </tbody></table>`;
    signLabels = ['ผู้เบิก','ผู้จ่ายของ','ผู้อนุมัติ'];
  } else if(kind==='return'){
    metaHtml = `<div>เลขที่: <b>${esc(doc.docNo)}</b></div><div>วันที่: ${thaiDate(doc.date)}</div><div>เหตุผล: ${esc(doc.reason||'-')}</div>${doc.refDocNo?`<div>อ้างอิงใบเบิกเลขที่: ${esc(doc.refDocNo)}</div>`:''}<div>ผู้คืน: ${esc(doc.returnedBy||'-')}</div>`;
    tableHtml = `<table class="print-table"><thead><tr><th>#</th><th>รหัส</th><th>รายการ</th><th>จำนวนที่คืน</th></tr></thead><tbody>
      ${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.code||'')}</td><td>${esc(it.name)}</td><td>${unitLabel(it)}</td></tr>`).join('')}
    </tbody></table>`;
    signLabels = ['ผู้คืนของ','ผู้ตรวจรับคืน','ผู้อนุมัติ'];
  } else if(kind==='po'){
    metaHtml = `<div>เลขที่: <b>${esc(doc.docNo)}</b></div>${doc.externalDocNo?`<div>เลขที่โรงพิมพ์: ${esc(doc.externalDocNo)}</div>`:''}<div>วันที่: ${thaiDate(doc.date)}</div>${doc.expectedDate?`<div>กำหนดรับ: ${thaiDate(doc.expectedDate)}</div>`:''}<div>ผู้จำหน่าย: ${esc(doc.supplier||'-')}</div>${doc.contact?`<div>ติดต่อ: ${esc(doc.contact)}</div>`:''}`;
    const sheetsTotal = items.reduce((s,i)=>s+(Number(i.qty)||0),0);
    const hasPrice = (Number(doc.subtotal)||0) > 0;
    tableHtml = `<table class="print-table"><thead><tr><th>#</th><th>รหัส</th><th>รายการ</th><th>จำนวน (แผ่น)</th><th>หมายเหตุ</th></tr></thead><tbody>
      ${items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.code||stickerById(it.stickerId)?.code||'')}</td><td>${esc(it.name)}</td><td>${num(it.qty)}</td><td>${esc(it.note||'')}</td></tr>`).join('')}
    </tbody></table>
    <div class="print-subtotal">รวมจำนวนแผ่นทั้งหมด: ${num(sheetsTotal)} แผ่น</div>`;
    if(hasPrice){
      totalHtml = `<div class="print-subtotal">ยอดก่อน VAT ${thb(doc.subtotal)}</div><div class="print-total">รวมเป็นเงินทั้งสิ้น (${doc.vatApplied?'รวม VAT':'ไม่รวม VAT'}): ${thb(doc.total)}</div>`;
    } else {
      totalHtml = `<div class="print-subtotal">ยังไม่ระบุราคา — รอใบเสนอราคาจากโรงพิมพ์เพื่อกรอกราคาและบันทึกในขั้นตอนถัดไป</div>`;
    }
    signLabels = ['ผู้จัดทำ PO','ผู้อนุมัติสั่งซื้อ','ผู้จำหน่าย'];
  }

  return `
    <div class="doc-head">
      <div><div class="brandline">NLCOFFEE ROASTING</div><h1>${esc(settings.companyName)}</h1><div class="brandline">ระบบจัดการสติ๊กเกอร์</div></div>
      <div class="doc-meta"><div class="doc-title-tag">${titleMap[kind]}</div>${metaHtml}</div>
    </div>
    ${tableHtml}
    ${totalHtml}
    ${doc.note?`<div class="print-note-box">หมายเหตุ: ${esc(doc.note)}</div>`:''}
    <div class="sign-grid">${signLabels.map(l=>`<div><div class="sign-line">${l}</div></div>`).join('')}</div>
  `;
}
function printDocument(kind, doc){
  document.getElementById('printArea').innerHTML = buildDocPrintHtml(kind, doc);
  document.body.classList.add('printing');
  setTimeout(()=>{ window.print(); }, 60);
}
window.addEventListener('afterprint', ()=> document.body.classList.remove('printing'));

/* ตัวอย่างก่อนพิมพ์ — โชว์หน้าเอกสารในโมดัลก่อน แล้วให้เลือกว่าจะสั่งพิมพ์จริง หรือบันทึกเป็นรูปภาพแทน
   (ใช้เนื้อหา HTML เดียวกับที่จะพิมพ์/แคปเจอร์ทุกประการ ย่อขนาดให้พอดีจอเพื่อดูตัวอย่าง) */
function openPrintPreview(html, {title, onPrint, onImage, padding}={}){
  openModal(`
    <div class="modal-head"><h3>${esc(title||'ตัวอย่างก่อนพิมพ์')}</h3><button class="btn btn-ghost btn-icon" data-close-modal>${icon('close',16)}</button></div>
    <div class="modal-body" style="padding:14px;">
      <div id="pp_scale_wrap" style="overflow:auto;background:#d8d8d8;border-radius:8px;padding:10px;">
        <div id="pp_inner" style="background:#fff;width:210mm;transform-origin:top center;box-shadow:0 2px 14px rgba(0,0,0,.25);margin:0 auto;">
          <div style="font-family:'Prompt',sans-serif;color:#1B1B2F;padding:${padding||'14mm'};">${html}</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close-modal>ปิด</button>
      <button class="btn btn-ghost" id="pp_image">${icon('download',15)}บันทึกเป็นรูปภาพ</button>
      <button class="btn btn-primary" id="pp_print">${icon('print',15)}สั่งพิมพ์</button>
    </div>
  `, {large:true});
  requestAnimationFrame(()=>{
    const wrap = document.getElementById('pp_scale_wrap');
    const inner = document.getElementById('pp_inner');
    if(!wrap || !inner) return;
    const naturalWidth = inner.offsetWidth;
    // จำกัดการย่อไม่ให้เล็กกว่า 62% เพื่อให้ยังอ่านออกบนมือถือจอแคบ — ถ้าเนื้อหากว้างกว่าที่ย่อได้พอดี ให้เลื่อนดูแทนแทนที่จะย่อจนตัวหนังสือเล็กเกินไป
    const scale = naturalWidth ? Math.max(0.62, Math.min(1, (wrap.clientWidth-20) / naturalWidth)) : 1;
    inner.style.transform = `scale(${scale})`;
    inner.style.marginInline = scale*naturalWidth <= wrap.clientWidth-20 ? 'auto' : '0';
    wrap.style.height = Math.ceil(inner.offsetHeight*scale + 20) + 'px';
  });
  document.getElementById('pp_print').addEventListener('click', ()=>{ closeModal(); if(onPrint) onPrint(); });
  document.getElementById('pp_image').addEventListener('click', ()=>{ closeModal(); if(onImage) onImage(); });
}

/* บันทึกเป็นรูปภาพ (PNG) — สำหรับมือถือที่กด "พิมพ์" แล้วไดอะล็อกพิมพ์ของเบราว์เซอร์ใช้งานไม่สะดวก
   ใช้เนื้อหาแบบฟอร์มเดียวกับตอนพิมพ์ทุกประการ แต่ rasterize เป็นภาพแล้วส่งให้ผู้ใช้บันทึก/แชร์แทน */
async function saveDocumentImage(kind, doc, mode){
  if(typeof html2canvas==='undefined'){
    toast('ไม่พร้อมใช้งานฟีเจอร์บันทึกรูปภาพในขณะนี้ ลองใช้ปุ่มพิมพ์แทน');
    return;
  }
  const isMobile = mode==='mobile';
  const area = document.getElementById('printArea');
  area.innerHTML = buildDocPrintHtml(kind, doc);
  area.classList.toggle('mobile-doc', isMobile);
  document.body.classList.add('capturing');
  await new Promise(r=> setTimeout(r, 80));
  try{
    const canvas = await html2canvas(area, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(!downloadsApi){
      toast('ไม่พบช่องทางบันทึกไฟล์ในเบราว์เซอร์นี้ ลองใช้ปุ่มพิมพ์แทน');
      return;
    }
    const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
    if(!blob){ toast('สร้างรูปภาพไม่สำเร็จ'); return; }
    await downloadsApi.save({filename:`${doc.docNo||kind}${isMobile?'-mobile':'-a4'}.png`, data: blob});
    toast('บันทึกรูปภาพเรียบร้อย');
  }catch(e){
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(e && e.code==='declined') return;
    console.error(e);
    toast('เกิดข้อผิดพลาดในการสร้างรูปภาพ');
  }
}

/* หลังบันทึกเอกสาร (ใบรับ/ใบเบิก/ใบคืน/ใบสั่งซื้อ) — ให้เลือกว่าจะพิมพ์ A4 หรือบันทึกเป็นรูปภาพ
   ถ้าเลือกบันทึกรูปภาพ ให้เลือกต่อว่าจะเอาแบบสำหรับดูในมือถือ หรือแบบสัดส่วน A4 */
function promptAfterSave(kind, doc, title){
  openPrintPreview(buildDocPrintHtml(kind, doc), {
    title: title || 'ตัวอย่างเอกสาร',
    onPrint: ()=> printDocument(kind, doc),
    onImage: ()=> chooseImageFormat(mode=> saveDocumentImage(kind, doc, mode)),
  });
}
function chooseImageFormat(onChoose){
  openModal(`
    <div class="modal-head"><h3>เลือกรูปแบบรูปภาพ</h3><button class="btn btn-ghost btn-icon" data-close-modal>${icon('close',16)}</button></div>
    <div class="modal-body" style="padding:16px;display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-ghost" id="imgfmt_mobile" style="justify-content:flex-start;padding:14px 16px;">
        <div style="text-align:left;"><div style="font-weight:700;">สำหรับมือถือ</div><div class="subtle" style="font-size:12px;">ตัวอักษรใหญ่ อ่านง่ายบนหน้าจอโทรศัพท์ ไม่ต้องซูม</div></div>
      </button>
      <button class="btn btn-ghost" id="imgfmt_a4" style="justify-content:flex-start;padding:14px 16px;">
        <div style="text-align:left;"><div style="font-weight:700;">ขนาด A4</div><div class="subtle" style="font-size:12px;">สัดส่วนตรงกับกระดาษพิมพ์จริง เหมาะสำหรับเก็บ/พิมพ์ภายหลัง</div></div>
      </button>
    </div>
  `);
  document.getElementById('imgfmt_mobile').addEventListener('click', ()=>{ closeModal(); onChoose('mobile'); });
  document.getElementById('imgfmt_a4').addEventListener('click', ()=>{ closeModal(); onChoose('a4'); });
}

function initUserName(){

function applyThemeMode(mode){
  if(mode!=='light' && mode!=='dim' && mode!=='dark') mode = 'light';
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem('nlc_theme_mode', mode); }catch(e){}
  document.querySelectorAll('#themeSwitch [data-theme-opt]').forEach(b=>{
    b.classList.toggle('active', b.dataset.themeOpt===mode);
  });
}
function initThemeSwitch(){
  let mode = 'light';
  try{ const saved = localStorage.getItem('nlc_theme_mode'); if(saved==='light'||saved==='dim'||saved==='dark') mode = saved; }catch(e){}
  applyThemeMode(mode);
  document.querySelectorAll('#themeSwitch [data-theme-opt]').forEach(b=>{
    b.addEventListener('click', ()=> applyThemeMode(b.dataset.themeOpt));
  });
}

  document.getElementById('sidebarBackdrop').classList.toggle('open');
});

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
});
