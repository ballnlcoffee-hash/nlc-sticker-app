<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังสติ๊กเกอร์ NLCOFFEE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  (function(){
    var m = 'light';
    try{ var saved = localStorage.getItem('nlc_theme_mode'); if(saved==='light'||saved==='dim'||saved==='dark') m = saved; }catch(e){}
    document.documentElement.setAttribute('data-theme', m);
  })();
</script>
<style>
  /* ===== Theme: Light (ครีม/ฟ้า/ส้ม, ตัวอักษรดำ) — ค่าเริ่มต้น ===== */
  :root{
    --bg:#FBF3E7;
    --surface:#FFFFFF;
    --surface-2:#F3E7D2;
    --border:#E6D6B8;
    --text:#241F1A;
    --text-muted:#726657;
    --accent:#FF8A34;
    --accent-strong:#E96F16;
    --accent-soft:#FFE3C2;
    --accent-contrast:#FFFFFF;
    --good:#2E9E5B;
    --good-soft:#DEF3E4;
    --warning:#B4790E;
    --warning-soft:#FBEED0;
    --critical:#D64545;
    --critical-soft:#FBE1E1;
    --info:#2B7FBE;
    --info-soft:#DDEEFB;
    --stale:#8B5CC7;
    --stale-soft:#EAE0F7;
    --shadow: 0 1px 2px rgba(40,30,10,.08), 0 8px 24px -12px rgba(40,30,10,.22);
    --side-bg:#1C6FA6;
    --side-text:#F5FAFF;
    --side-text-muted:#BFE0F5;
    --side-active:#155887;
    --side-accent:#FF8A34;
    --side-border:#155887;
    --radius:10px;
  }
  /* ===== Theme: Dim (เทา/คราม/ส้ม, ตัวอักษรดำ) ===== */
  :root[data-theme="dim"]{
    --bg:#DDDEE1;
    --surface:#F1F2F3;
    --surface-2:#CBCDD2;
    --border:#B7BAC0;
    --text:#201F22;
    --text-muted:#5B5D63;
    --accent:#FF8A34;
    --accent-strong:#E96F16;
    --accent-soft:#FFE3C2;
    --accent-contrast:#FFFFFF;
    --good:#2E9E5B;
    --good-soft:#D6EBDD;
    --warning:#A66A0C;
    --warning-soft:#EFE1C4;
    --critical:#C23B3B;
    --critical-soft:#F1D8D8;
    --info:#3B4E8F;
    --info-soft:#DADFF0;
    --stale:#7A4EB5;
    --stale-soft:#DDD0EC;
    --shadow: 0 1px 2px rgba(20,20,30,.15), 0 8px 24px -12px rgba(20,20,30,.35);
    --side-bg:#2B3A67;
    --side-text:#E7EAF5;
    --side-text-muted:#AAB3D6;
    --side-active:#20294D;
    --side-accent:#FF8A34;
    --side-border:#20294D;
    --radius:10px;
  }
  /* ===== Theme: Dark (ดำ/เทาเข้ม/ส้ม, ตัวอักษรขาว) ===== */
  :root[data-theme="dark"]{
    --bg:#101113;
    --surface:#1A1B1E;
    --surface-2:#232428;
    --border:#333438;
    --text:#F2F2F0;
    --text-muted:#9EA0A6;
    --accent:#FF8A34;
    --accent-strong:#FFA35C;
    --accent-soft:#3A2612;
    --accent-contrast:#1A1108;
    --good:#4CC080;
    --good-soft:#173324;
    --warning:#E2B24F;
    --warning-soft:#3A2E12;
    --critical:#E6716B;
    --critical-soft:#3A1C1A;
    --info:#7C93D6;
    --info-soft:#1E2438;
    --stale:#B08FE0;
    --stale-soft:#2C2440;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --side-bg:#0B0C0E;
    --side-text:#F2F2F0;
    --side-text-muted:#9EA0A6;
    --side-active:#1E1F22;
    --side-accent:#FF8A34;
    --side-border:#1E1F22;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  ::-webkit-scrollbar-button{display:none;width:0;height:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Prompt',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Prompt',sans-serif;margin:0;text-wrap:balance;font-weight:600;}
  table{font-variant-numeric:tabular-nums;}
  .mono{font-family:'Prompt',sans-serif;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  a{color:var(--accent-strong);}
  ::selection{background:var(--accent-soft);}

  .app{display:flex;min-height:100vh;}
  .app[hidden]{display:none;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:242px;flex:none;background:var(--side-bg);color:var(--side-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--side-border);
  }
  .brand{padding:20px 18px 14px;border-bottom:1px solid var(--side-border);}
  .brand-name{font-family:'Prompt',sans-serif;font-weight:700;font-size:17px;letter-spacing:.2px;color:var(--side-text);}
  .brand-sub{font-size:12px;color:var(--side-text-muted);margin-top:2px;}
  .nav{flex:1;padding:12px 10px;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:right;
    padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--side-text-muted);
    cursor:pointer;font-size:14px;margin-bottom:2px;transition:background .12s,color .12s;
    flex-direction:row-reverse;justify-content:flex-end;
  }
  .nav-item svg{width:18px;height:18px;flex:none;opacity:.85;}
  .nav-item:hover{background:var(--side-active);color:var(--side-text);}
  .nav-item.active{background:var(--side-active);color:var(--side-accent);font-weight:600;}
  .nav-item .nav-badge{
    margin-inline-start:auto;background:var(--critical);color:#fff;font-size:11px;font-weight:700;
    border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;
  }
  .sidebar-footer{padding:12px 16px 16px;border-top:1px solid var(--side-border);}
  .theme-switch{display:flex;gap:3px;background:rgba(0,0,0,.18);border-radius:8px;padding:3px;margin-bottom:10px;}
  .theme-btn{position:relative;flex:1;border:none;background:transparent;color:var(--side-text-muted);font-family:'Prompt',sans-serif;font-size:11.5px;font-weight:600;padding:6px 4px 6px 14px;border-radius:6px;cursor:pointer;transition:color .15s;}
  .theme-btn.active{color:#fff;}
  .theme-btn.active::before{content:'';position:absolute;top:6px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--side-accent);}
  .sync-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-text-muted);}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;}
  .sync-dot.offline{background:var(--critical);}
  .sync-dot.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface);
    position:sticky;top:0;z-index:5;
  }
  .topbar h2{font-size:19px;}
  .topbar-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .user-field{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);}
  .user-field input{width:120px;}
  .content{padding:22px 26px 60px;max-width:1280px;width:100%;margin:0 auto;}
  .view[hidden]{display:none;}

  /* ---------- Basics ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);padding:8px 14px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-contrast);}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{color:var(--critical);}
  .btn-danger:hover{border-color:var(--critical);}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  /* ปุ่มไอคอนล้วน (แก้ไข/ลบ/ปรับสต็อก ฯลฯ) ขยายพื้นที่กดจริงด้วย ::after แบบมองไม่เห็น
     โดยไม่ขยายขนาดไอคอน/เค้าโครงที่มองเห็น เพื่อไม่ให้กระทบความสูงแถวตารางที่จัดวางไว้แล้ว */
  .btn-icon{padding:8px;position:relative;}
  .btn-icon::after{content:'';position:absolute;inset:-4px;}
  .btn-icon+.btn-icon{margin-inline-start:4px;}
  .thumb-btn{border:none;background:none;padding:0;cursor:pointer;border-radius:6px;line-height:0;}
  .thumb-btn:hover{outline:2px solid var(--accent);outline-offset:1px;}
  @media (max-width:640px){
    .thumb-btn img,.thumb-btn>div{width:56px!important;height:56px!important;}
  }
  #f_image_preview:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);}

  .input,.select,textarea.input{
    width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);outline:none;
  }
  .input:focus,.select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .input-error{border-color:var(--critical) !important;box-shadow:0 0 0 3px var(--critical-soft) !important;animation:input-shake .35s;}
  @keyframes input-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:600;}
  .user-chip button{border:none;background:var(--border);color:var(--text-muted);width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .user-chip button:hover{background:var(--critical);color:#fff;}
  label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:4px;font-weight:600;}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:640px){.field-row,.field-row3{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:18px 20px;}
  .section-title{font-size:15.5px;margin-bottom:2px;}
  .section-desc{font-size:12.5px;color:var(--text-muted);margin-bottom:14px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:980px){.stat-grid{grid-template-columns:repeat(2,1fr);}.stat-grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .stat-value{font-family:'Prompt',sans-serif;font-size:24px;font-weight:700;margin-top:4px;}
  .stat-sub{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .stat-card.accentline{border-top:3px solid var(--accent);}
  .stat-card.criticalline{border-top:3px solid var(--critical);}
  .stat-card.goodline{border-top:3px solid var(--good);}
  .stat-card.infoline{border-top:3px solid var(--info);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:980px){.grid-2{grid-template-columns:1fr;}}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px;}
  thead th{
    text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);
    background:var(--surface-2);padding:10px 12px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--border);
  }
  thead th:first-child{text-align:right;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td,th{text-align:right;}
  td.left,th.left{text-align:right;}
  .num{font-variant-numeric:tabular-nums;}
  .sort-th-btn{border:none;background:none;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:4px;}
  .sort-th-btn:hover{color:var(--accent);}
  .sort-arrow{font-size:9px;}
  .subtle{color:var(--text-muted);font-size:11.5px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-ok{background:var(--good-soft);color:var(--good);}
  .badge-warning{background:var(--warning-soft);color:var(--warning);}
  .badge-critical{background:var(--critical-soft);color:var(--critical);}
  .badge-info{background:var(--info-soft);color:var(--info);}
  .badge-neutral{background:var(--surface-2);color:var(--text-muted);}
  .badge-stale{background:var(--stale-soft);color:var(--stale);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search{width:220px;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-muted);}
  .empty-state svg{width:34px;height:34px;margin-bottom:8px;opacity:.5;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;}
  .tab{padding:9px 14px;border:none;background:transparent;color:var(--text-muted);font-weight:600;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none;}
  .tab.active{color:var(--accent-strong);border-bottom-color:var(--accent);}

  .line-items{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;}
  .line-item-row{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:end;background:var(--surface);}
  .line-item-row:last-child{border-bottom:none;}
  .line-item-row.head{background:var(--surface-2);padding:8px 12px;font-size:11.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;align-items:center;}
  .line-item-row.receive-cols{grid-template-columns:1.8fr 1.3fr .9fr 1fr auto;}
  .line-item-row.po-cols{grid-template-columns:40px 1.6fr .8fr .9fr 1.2fr .9fr auto;}
  .li-label{display:none;}
  @media (max-width:760px){
    .line-item-row{grid-template-columns:1fr!important;}
    .line-item-row.head{display:none;}
    .li-label{display:block;font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px;}
    .li-remove{display:flex;justify-content:flex-end;}
  }
  .amount-col{text-align:left;font-weight:600;padding-bottom:8px;}
  .line-item-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-2);gap:12px;flex-wrap:wrap;}
  .total-line{font-family:'Prompt',sans-serif;font-weight:700;font-size:16px;}

  .line-card{border-bottom:1px solid var(--border);padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-end;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .line-card:last-child{border-bottom:none;}
  .line-card select.select{flex:1 1 220px;min-width:180px;}
  .line-card > [data-remove-line]{flex:none;}
  .mini-field{min-width:110px;flex:none;}
  .mini-field label{margin-bottom:3px;white-space:nowrap;}
  .mini-readout{font-size:12.5px;color:var(--text-muted);align-self:center;padding-bottom:8px;flex:none;white-space:nowrap;}
  .mini-readout b{color:var(--text);}
  .unit-toggle{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex:none;}
  .unit-toggle .seg{padding:8px 12px;border:none;background:var(--surface);color:var(--text-muted);font-weight:600;font-size:12.5px;cursor:pointer;}
  .unit-toggle .seg + .seg{border-inline-start:1px solid var(--border);}
  .unit-toggle .seg.active{background:var(--accent);color:var(--accent-contrast);}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);padding-bottom:9px;cursor:pointer;user-select:none;}
  .chk input{width:auto;}

  .stock-hint{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .stock-hint.warn{color:var(--critical);font-weight:600;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,10,25,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-backdrop[hidden]{display:none;}
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border:1px solid var(--border);}
  .modal.modal-lg{max-width:860px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
  .modal-body{padding:18px 20px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap;}

  .toast-wrap{position:fixed;bottom:20px;left:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--side-bg);color:var(--side-text);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);animation:toastin .15s ease-out;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .usage-bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .usage-bar-row .name{width:120px;flex:none;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .usage-bar-track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .usage-bar-fill{height:100%;background:var(--accent);border-radius:99px;}
  .usage-bar-val{width:56px;flex:none;text-align:left;font-size:12px;color:var(--text-muted);}

  .kv-list{display:flex;flex-direction:column;gap:9px;}
  .kv-row{display:flex;justify-content:space-between;font-size:13px;}
  .kv-row .k{color:var(--text-muted);}
  .kv-row .v{font-weight:600;}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;}
  .banner.info{background:var(--info-soft);color:var(--info);border-color:var(--info);}
  .banner svg{width:18px;height:18px;flex:none;margin-top:1px;}
  .hamburger{display:none;}
  .sidebar-backdrop{display:none;}
  @media (max-width:880px){
    .app{overflow-x:hidden;}
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:40;width:250px;
      transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 28px rgba(0,0,0,.35);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .sidebar-backdrop.open{opacity:1;pointer-events:auto;}
    .hamburger{display:inline-flex;}
    .content{padding:18px 14px 60px;}
    .topbar{padding:12px 14px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .stat-grid.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:420px){
    .stat-grid,.stat-grid.cols-3{grid-template-columns:1fr;}
  }

  /* Print / image-export layout — styling is always-on (scoped to #printArea,
     which stays display:none until .printing or .capturing shows it), so the
     exact same look is used for browser printing and for the "save as image"
     capture on mobile. */
  #printArea{display:none;}
  #printArea{
    font-family:'Prompt',sans-serif;color:#1B1B2F;padding:14mm;max-width:210mm;margin:0 auto;background:#fff;
  }
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #241F1A;padding-bottom:12px;margin-bottom:18px;}
  .doc-head h1{font-size:19px;margin:0 0 4px;color:#241F1A;}
  .doc-head .brandline{font-size:12px;color:#555;}
  .doc-meta{text-align:left;font-size:12.5px;}
  .doc-meta div{margin-bottom:2px;}
  .doc-title-tag{font-family:'Prompt',sans-serif;font-size:22px;font-weight:700;text-align:left;color:#E96F16;}
  table.print-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12.5px;}
  table.print-table th,table.print-table td{border:1px solid #999;padding:6px 8px;}
  table.print-table th{background:#FFE3C2;text-align:right;}
  .print-total{text-align:left;font-size:15px;font-weight:700;margin-bottom:6px;}
  .print-subtotal{text-align:left;font-size:12.5px;color:#555;margin-bottom:3px;}
  .print-note-box{font-size:12px;color:#555;margin-bottom:20px;}
  .sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:50px;font-size:12.5px;text-align:center;}
  .sign-line{border-top:1px solid #333;margin-top:40px;padding-top:6px;}
  /* ใบตรวจนับสต็อค — บีบให้พอดี 1 หน้า A4 แม้มีหลายสิบรายการ */
  #printArea:has(.count-sheet){padding:8mm 10mm;}
  .count-sheet .doc-head{margin-bottom:10px;padding-bottom:8px;}
  .count-sheet table.print-table th,.count-sheet table.print-table td{padding:3px 6px;font-size:10px;}
  .count-sheet .sign-grid{margin-top:16px;}
  .count-sheet .sign-line{margin-top:22px;}
  @page{size:A4;margin:10mm;}
  @media print{
    body.printing > .app{display:none;}
    body.printing > #printArea{display:block;}
  }
  /* Off-screen render used only to rasterize #printArea into a PNG (for
     mobile "save as image", where the print dialog is unreliable). */
  body.capturing > #printArea{display:block;position:fixed;left:-99999px;top:0;width:794px;}
  /* รูปแบบ "สำหรับมือถือ" — แคบลง ตัวอักษรใหญ่ขึ้น ให้ดูสบายตาบนจอโทรศัพท์โดยไม่ต้องซูม
     (ต่างจากรูปแบบ A4 ที่สัดส่วนตรงกับกระดาษพิมพ์จริง) */
  body.capturing > #printArea.mobile-doc{width:480px;}
  #printArea.mobile-doc{padding:5mm 4mm;}
  #printArea.mobile-doc .doc-head{flex-direction:column;gap:8px;}
  #printArea.mobile-doc .doc-title-tag{font-size:18px;}
  #printArea.mobile-doc table.print-table{font-size:12px;}
  #printArea.mobile-doc table.print-table th,#printArea.mobile-doc table.print-table td{padding:5px 6px;white-space:normal;word-break:break-word;}
  #printArea.mobile-doc:has(.count-sheet){padding:5mm 4mm;}
  #printArea.mobile-doc .count-sheet table.print-table th,#printArea.mobile-doc .count-sheet table.print-table td{font-size:10.5px;padding:4px 5px;}
  #printArea.mobile-doc .sign-grid{grid-template-columns:1fr;gap:10px;margin-top:26px;}
  #printArea.mobile-doc .sign-line{margin-top:24px;}

  /* ===== Google sign-in gate ===== */
  .auth-gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .auth-gate[hidden]{display:none;}
  .auth-card{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);}
  .auth-card .brand-name{font-size:20px;font-weight:700;margin-bottom:2px;color:var(--text);}
  .auth-card .brand-sub{color:var(--text-muted);font-size:13px;margin-bottom:24px;}
  .auth-card .auth-desc{color:var(--text-muted);font-size:13px;margin-bottom:20px;line-height:1.6;}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .google-btn:hover{background:var(--surface-2);}
  .auth-email-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:20px;padding:6px 14px;font-size:13px;margin-bottom:16px;}
  .auth-denied-title{color:var(--critical);font-weight:700;font-size:15px;margin-bottom:8px;}
</style>
</head>

function setSync(state){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if(state==='connected'){
    dot.className='sync-dot';
    label.textContent='เชื่อมต่อแล้ว · ใช้งานพร้อมกันได้หลายคน';
  } else if(state==='connecting'){
    dot.className='sync-dot pulse';
    label.textContent='กำลังเชื่อมต่อ…';
  } else if(state==='offline'){
    dot.className='sync-dot offline';
    label.textContent='ออฟไลน์ · ข้อมูลจะไม่ถูกบันทึกถาวร';
  } else {
    dot.className='sync-dot offline';
    label.textContent='เกิดข้อผิดพลาดในการเชื่อมต่อ';
  }
}

function showAuthGate(html){
  const gate = document.getElementById('authGate');

  gate.innerHTML = html;
  gate.hidden = false;

}

  document.getElementById('authGate').hidden = true;

}

  const inApp = isInAppBrowser();

      </div>
      <button type="button" class="google-btn" id="autoSafariBtn" style="margin-bottom:10px;">${icon('upload',16)}เปิดใน Safari อัตโนมัติ (ลองก่อน)</button>
      <button type="button" class="google-btn" id="copyLinkBtn" style="margin-bottom:10px;">${icon('docs',16)}คัดลอกลิงก์ไปเปิดใน Safari</button>
      ` : `
      <div class="auth-desc">เข้าสู่ระบบด้วยบัญชี Google ของคุณเพื่อใช้งานระบบ</div>
      `}
      <button type="button" class="google-btn" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.3 10.4z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.9 39.8 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4 5.7l6.6 5.4C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        เข้าสู่ระบบด้วย Google
      </button>
      ${inApp ? `<div class="auth-desc" style="margin-top:14px;font-size:12px;">(ถ้ายังอยู่ในแอปแชท ปุ่มนี้จะเข้าสู่ระบบไม่สำเร็จ)</div>` : ''}
    </div>
  `);
  document.getElementById('googleSignInBtn').addEventListener('click', ()=>{
    const provider = new firebase.auth.GoogleAuthProvider();
    const ua = navigator.userAgent || '';
    const isSafari = /^((?!chrome|crios|fxios|edgios|android).)*safari/i.test(ua);
    const primary = isSafari ? 'popup' : 'redirect';
    const runSignIn = (method)=>{
      const p = method==='popup' ? auth.signInWithPopup(provider) : auth.signInWithRedirect(provider);
      return p;
    };
    runSignIn(primary).catch(err=>{
      console.error('sign-in ('+primary+') failed', err && err.code, err);
      const retryable = err && ['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(err.code);
      if(retryable){
        const fallback = primary==='popup' ? 'redirect' : 'popup';
        runSignIn(fallback).catch(err2=>{
          console.error('sign-in ('+fallback+') failed', err2 && err2.code, err2);
          alert('เข้าสู่ระบบไม่สำเร็จ: '+(err2.message||err2.code||'ไม่ทราบสาเหตุ')+'\n\nลองปิดโหมดส่วนตัว (Private Browsing) หรือเปิด "อนุญาตคุกกี้ข้ามเว็บไซต์" ใน Safari แล้วลองใหม่');
        });
      } else {
        alert('เข้าสู่ระบบไม่สำเร็จ: '+(err.message||err.code||'ไม่ทราบสาเหตุ'));
      }
    });
  });
  const copyBtn = document.getElementById('copyLinkBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', async ()=>{
      const url = location.href;
      try{
        await navigator.clipboard.writeText(url);
        copyBtn.textContent = 'คัดลอกลิงก์แล้ว! วางใน Safari';
      }catch(e){
        prompt('คัดลอกลิงก์นี้ไปวางใน Safari:', url);
      }
    });
  }
  const autoBtn = document.getElementById('autoSafariBtn');
  if(autoBtn){
    autoBtn.addEventListener('click', ()=>{
      const url = location.href;
      if(url.startsWith('https://')){
        location.href = 'x-safari-https://' + url.slice('https://'.length);
      } else if(url.startsWith('http://')){
        location.href = 'x-safari-http://' + url.slice('http://'.length);
      }
    });
  }
}

let firestoreUnsubs = [];
function stopFirestoreSync(){
  firestoreUnsubs.forEach(fn=>{ try{ fn(); }catch(e){} });
  firestoreUnsubs = [];
}
function startFirestoreSync(){
  setSync('connected');
  COLLECTIONS.forEach(col=>{
    firestoreUnsubs.push(dbApi.collection(col).onSnapshot(snap=>{
      cache[col] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      notify();
    }, err=>{ console.error('db error', col, err); setSync('error'); }));
  });
  firestoreUnsubs.push(dbApi.doc('settings/config').onSnapshot(snap=>{
    cache.settings = snap.exists ? snap.data() : {};
    notify();
  }, err=>{ console.error('settings error', err); }));
  firestoreUnsubs.push(dbApi.doc('access/allowlist').onSnapshot(snap=>{
    cache.access = snap.exists ? snap.data() : {emails:[]};
    notify();
  }, err=>{ console.error('access error', err); }));
}

async function checkAccessAndBoot(user){
  try{
    const ref = dbApi.doc('access/allowlist');
    const snap = await ref.get();
    let emails = [];
    if(!snap.exists){
      emails = [];
      await ref.set({emails});
    } else {
      emails = (snap.data().emails||[]).map(e=>String(e).toLowerCase());
    }
    const email = (user.email||'').toLowerCase();
    if(email===OWNER_EMAIL.toLowerCase() || emails.includes(email)){
      hideAuthGate();
      startFirestoreSync();
    } else {
      renderDeniedScreen(user);
    }
  }catch(e){
    console.error('access check failed', e);
    renderDeniedScreen(user);
  }
}

async function initData(){

    save: async ({filename, data})=>{
      const blob = (data instanceof Blob) ? data : new Blob([data], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);

  if(FIREBASE_NOT_CONFIGURED){
    localMode = true;
    hideAuthGate();
    setSync('offline');
    window.__localModeWarned = true;
    notify();
    return;
  }

  dbApi = firebase.firestore();

    if(err && err.code) alert('เข้าสู่ระบบไม่สำเร็จ: '+(err.message||err.code));

}

/* อ่านไฟล์รูปที่ผู้ใช้เลือก แล้วครอปเป็นสี่เหลี่ยมจัตุรัสขนาดเล็ก บีบอัดเป็น JPEG ก่อนเก็บลงฐานข้อมูล */
function readImageAsSquareDataUrl(file, size){
  size = size||240;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error||new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image load failed'));
      img.onload = ()=>{
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   DERIVED: stock / cost / usage
========================================================= */
function computeStockMap(){
  const map = {};
  cache.stickers.forEach(s=>{ map[s.id] = {stock:0,totalInQty:0,totalInAmount:0,totalOutQty:0,lastAt:null}; });
  const sorted = cache.movements.slice().sort((a,b)=> (a.at||'').localeCompare(b.at||''));
  sorted.forEach(m=>{
    if(!map[m.stickerId]) map[m.stickerId] = {stock:0,totalInQty:0,totalInAmount:0,totalOutQty:0,lastAt:null};
    const r = map[m.stickerId];
    const qty = Number(m.qty)||0;
    if(m.type==='IN'){ r.stock += qty; r.totalInQty += qty; r.totalInAmount += qty*(Number(m.unitCost)||0); }
    else if(m.type==='OUT'){ r.stock -= qty; r.totalOutQty += qty; }
    else if(m.type==='ADJUST'){ r.stock += qty; }
    else if(m.type==='RETURN'){ r.stock += qty; } // stock returned to shelf — cost basis unchanged, excluded from average-cost calc
    r.lastAt = m.at;
  });
  Object.keys(map).forEach(id=>{ map[id].avgCost = map[id].totalInQty>0 ? (map[id].totalInAmount/map[id].totalInQty) : 0; });
  return map;
}
function computeUsage(days){
  const cutoff = Date.now() - days*86400000;
  const usage = {};
  cache.movements.forEach(m=>{
    if(m.type!=='OUT') return;
    if(m.at && new Date(m.at).getTime() < cutoff) return;
    usage[m.stickerId] = (usage[m.stickerId]||0) + (Number(m.qty)||0);
  });
  return usage;
}
/** OUT usage within the half-open window (now - fromDaysAgo, now - toDaysAgo]. */
function computeUsageWindow(fromDaysAgo, toDaysAgo){
  const now = Date.now();
  const start = now - fromDaysAgo*86400000;
  const end = now - toDaysAgo*86400000;
  const usage = {};
  cache.movements.forEach(m=>{
    if(m.type!=='OUT' || !m.at) return;
    const t = new Date(m.at).getTime();
    if(t>start && t<=end) usage[m.stickerId] = (usage[m.stickerId]||0) + (Number(m.qty)||0);
  });
  return usage;
}
function computeLastOutMap(){
  const map = {};
  cache.movements.forEach(m=>{
    if(m.type!=='OUT' || !m.at) return;
    if(!map[m.stickerId] || m.at > map[m.stickerId]) map[m.stickerId] = m.at;
  });
  return map;
}
/** Per-sticker recent OUT stats: average qty of the last 3 issues, and the date of the most recent issue. */
function computeRecentOutStats(){
  const bySticker = {};
  cache.movements.forEach(m=>{
    if(m.type!=='OUT' || !m.at) return;
    (bySticker[m.stickerId] = bySticker[m.stickerId]||[]).push(m);
  });
  const map = {};
  Object.keys(bySticker).forEach(id=>{
    const list = bySticker[id].slice().sort((a,b)=> (b.at||'').localeCompare(a.at||''));
    const last3 = list.slice(0,3);
    const avg3 = last3.length ? last3.reduce((s,m)=>s+(Number(m.qty)||0),0)/last3.length : 0;
    map[id] = {avg3, lastAt: list[0].at};
  });
  return map;
}
/**
 * สถานะ 4 ระดับ ตามยอดคงเหลือเทียบกับค่าเฉลี่ยการเบิกใช้ 3 ครั้งล่าสุด:
 *  - ค้าง (stale): ไม่มีการเบิกมา 30 วัน (รวมถึงไม่เคยเบิกเลย)
 *  - ปกติ (ok): คงเหลือ > 5 เท่าของค่าเฉลี่ยเบิกใช้ 3 ครั้งล่าสุด
 *  - ระวัง (warning): คงเหลือ > 3 เท่า (แต่ไม่เกิน 5 เท่า)
 *  - วิกฤต (critical): คงเหลือ <= 3 เท่า หรือ คงเหลือต่ำกว่า 30 ดวง
 */
function stockStatus(stock, stickerId, recentStats){
  stock = Number(stock)||0;
  const info = recentStats ? recentStats[stickerId] : null;
  const lastAt = info?.lastAt;
  const daysSinceOut = lastAt ? (Date.now() - new Date(lastAt).getTime())/86400000 : Infinity;
  if(daysSinceOut > 30) return 'stale';
  if(stock < 30) return 'critical';
  const avg3 = info?.avg3 || 0;
  if(avg3<=0) return 'ok';
  const ratio = stock/avg3;
  if(ratio > 5) return 'ok';
  if(ratio > 3) return 'warning';
  return 'critical';
}
function badgeForStatus(st){
  if(st==='critical') return `<span class="badge badge-critical"><span class="dot"></span>วิกฤต</span>`;
  if(st==='warning') return `<span class="badge badge-warning"><span class="dot"></span>ระวัง</span>`;
  if(st==='stale') return `<span class="badge badge-stale"><span class="dot"></span>ค้าง</span>`;
  return `<span class="badge badge-ok"><span class="dot"></span>ปกติ</span>`;
}

function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const settings = getSettings();
  const stockMap = computeStockMap();
  const recentStats = computeRecentOutStats();
  const stickers = activeStickers();
  const criticalList = stickers
    .map(s=>({s, stock: stockMap[s.id]?.stock||0, status: stockStatus(stockMap[s.id]?.stock||0, s.id, recentStats)}))
    .filter(x=>x.status==='critical'||x.status==='warning')
    .sort((a,b)=> a.stock - b.stock);
  const pendingPOs = cache.purchaseOrders.filter(p=>p.status==='pending');
  const pendingPOValue = pendingPOs.reduce((s,p)=> s + (Number(p.total)||0), 0);
  const recent = cache.movements.slice().sort((a,b)=> (b.at||'').localeCompare(a.at||'')).slice(0,8);

  const usage30 = computeUsageWindow(30,0);
  const usagePrev30 = computeUsageWindow(60,30);
  const top3 = Object.entries(usage30).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const maxTop3 = top3.length ? top3[0][1] : 0;
  const growing = stickers.map(s=>{
    const cur = usage30[s.id]||0, prev = usagePrev30[s.id]||0;
    return {s, cur, prev, delta: cur-prev};
  }).filter(x=>x.cur>0 && x.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,5);
  const usage90 = computeUsage(90);
  const lastOutMap = computeLastOutMap();
  const stale = stickers.map(s=>({s, usage90: usage90[s.id]||0, lastOutAt: lastOutMap[s.id]||null}))
    .sort((a,b)=>{
      if(a.usage90!==b.usage90) return a.usage90-b.usage90;
      return (a.lastOutAt||'').localeCompare(b.lastOutAt||'');
    }).slice(0,5);

  const lastPO = cache.purchaseOrders.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  let cycleHtml = '';
  if(lastPO){
    const daysSince = Math.floor((Date.now() - new Date(lastPO.date+'T00:00:00').getTime())/86400000);
    const due = daysSince >= settings.orderCycleMinDays;
    cycleHtml = `<div class="banner ${due?'':'info'}">${icon('history',18)}<div>สั่งซื้อครั้งล่าสุดเมื่อ ${daysSince} วันที่แล้ว (${thaiDate(lastPO.date)}) — ตามรอบการสั่งซื้อของโรงพิมพ์ (${settings.orderCycleMinDays}-${settings.orderCycleMaxDays} วัน) ${due?'<b>ถึงเวลาพิจารณาสั่งซื้อรอบถัดไปแล้ว</b>':`ควรสั่งซื้อรอบถัดไปภายในอีก ${Math.max(0,settings.orderCycleMinDays-daysSince)} วัน`}</div></div>`;
  }

  const lastCount = settings.lastStockCountAt;
  const nextCountDue = lastCount ? addDays(lastCount, settings.stockCountCycleDays) : todayIso();
  const daysUntilCount = Math.ceil((new Date(nextCountDue+'T00:00:00') - new Date(todayIso()+'T00:00:00'))/86400000);
  const countOverdue = !lastCount || daysUntilCount<0;
  const countSoon = !countOverdue && daysUntilCount<=3;

function rowMovement(m){
  const s = stickerById(m.stickerId);
  const typeBadge = m.type==='IN' ? `<span class="badge badge-ok">รับเข้า</span>` : m.type==='OUT' ? `<span class="badge badge-critical">เบิกออก</span>` : `<span class="badge badge-info">ปรับปรุง</span>`;
  const sign = m.type==='OUT' ? '-' : '+';
  const unitNote = m.enteredUnit==='SHEET' ? ` (${num(m.enteredQty)} แผ่น)` : '';
  return `<tr>
    <td class="left">${thaiDateTime(m.at)}</td>
    <td class="left">${typeBadge}</td>
    <td class="left">${esc(s?stickerLabel(s):'(ไม่พบ)')}</td>
    <td class="num">${sign}${num(m.qty)}<span class="subtle">${unitNote}</span></td>
    <td class="left mono" style="font-size:12px;">${esc(m.docNo||'-')}</td>
    <td class="left">${esc(m.by||'-')}</td>
  </tr>`;
}

let stockSearch = '';
let stockSortDir = 'asc';
function renderStock(){
  const el = document.getElementById('view-stock');
  const stockMap = computeStockMap();
  const usage10 = computeUsage(10);
  const recentStats = computeRecentOutStats();
  let list = activeStickers();
  if(stockSearch.trim()){
    const q = stockSearch.trim().toLowerCase();
    list = list.filter(s=> (s.name||'').toLowerCase().includes(q) || (s.code||'').toLowerCase().includes(q));
  }
  list = list.slice().sort((a,b)=> stockSortDir==='asc' ? (a.code||'').localeCompare(b.code||'') : (b.code||'').localeCompare(a.code||''));
  el.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="input search" id="stockSearchInput" placeholder="ค้นหาชื่อ/รหัสสติ๊กเกอร์…" value="${esc(stockSearch)}">
        <button class="btn btn-ghost btn-sm" id="exportStockBtn">${icon('download',14)}ส่งออก CSV</button>
      </div>
      <button class="btn btn-primary" id="addStickerBtn">${icon('plus',15)}เพิ่มรายการสินค้าใหม่</button>
    </div>
    <div class="card">
      ${list.length===0 ? `<div class="empty-state">${icon('stock',30)}<div>ยังไม่มีชนิดสติ๊กเกอร์ — ลองนำเข้าแคตตาล็อกที่หน้า "ตั้งค่า/ข้อมูลอ้างอิง" หรือเพิ่มเอง</div></div>` : `
      <div class="table-wrap"><table><thead><tr>
        <th class="left"><button type="button" class="sort-th-btn" id="stockSortBtn" title="เรียงตามรหัส A-Z / Z-A">รหัส <span class="sort-arrow">${stockSortDir==='asc'?'▲':'▼'}</span></button></th><th></th><th class="left" style="padding-left:46px;">ชื่อสติ๊กเกอร์</th><th>สถานะ</th><th>คงเหลือ (ดวง)</th><th>เบิกใช้ (10 วันล่าสุด)</th>
        <th>ต้นทุนเฉลี่ย/ดวง</th>
      </tr></thead><tbody>
        ${list.map(s=>{
          const st = stockMap[s.id]||{stock:0,avgCost:0};
          const status = stockStatus(st.stock, s.id, recentStats);
          const eq = sheetsEq(st.stock, s);
          return `<tr>
            <td class="left mono" style="font-size:12px;">${esc(s.code||'-')}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm btn-icon" data-adjust="${s.id}" title="ปรับปรุงสต็อก">${icon('adjustpm',15)}</button>
              <button class="btn btn-ghost btn-sm btn-icon" data-edit-sticker="${s.id}" title="แก้ไข">${icon('edit',15)}</button>
            </td>
            <td class="left" style="font-weight:600;">
              <div style="display:flex;align-items:center;gap:10px;">
                <button type="button" class="thumb-btn" data-edit-thumb="${s.id}" title="คลิกเพื่ออัปโหลด/วางรูปสติ๊กเกอร์นี้">${stickerThumbHtml(s,36)}</button>
                <div>${esc(s.name)}${s.sizeCm?` <span class="subtle" style="font-weight:400;">(${esc(s.sizeCm)}cm)</span>`:''}${pps(s)?` <span class="subtle" style="font-weight:400;">(${num(pps(s))}Pcs.)</span>`:''}</div>
              </div>
            </td>
            <td>${badgeForStatus(status)}</td>
            <td class="num">${num(st.stock)} ดวง${eq!=null?`<div class="subtle" style="font-size:11.5px;">= ${num(eq,1)} แผ่น</div>`:''}</td>
            <td class="num">${num(usage10[s.id]||0)} ดวง</td>
            <td class="num">${thb(st.avgCost)}<div class="subtle" style="font-size:11.5px;">รวม ${thb(st.stock*st.avgCost)}</div></td>
          </tr>`;
        }).join('')}
      </tbody></table></div>`}
    </div>
  `;
  document.getElementById('stockSearchInput').addEventListener('input', e=>{ stockSearch = e.target.value; renderStock(); });
  document.getElementById('addStickerBtn').addEventListener('click', ()=> openStickerModal());
  document.getElementById('exportStockBtn').addEventListener('click', exportStockCsv);
  const stockSortBtn = document.getElementById('stockSortBtn');
  if(stockSortBtn) stockSortBtn.addEventListener('click', ()=>{ stockSortDir = stockSortDir==='asc'?'desc':'asc'; renderStock(); });
  el.querySelectorAll('[data-edit-sticker]').forEach(b=> b.addEventListener('click', ()=> openStickerModal(stickerById(b.dataset.editSticker))));
  el.querySelectorAll('[data-edit-thumb]').forEach(b=> b.addEventListener('click', ()=> openStickerModal(stickerById(b.dataset.editThumb), {focusImage:true})));
  el.querySelectorAll('[data-adjust]').forEach(b=> b.addEventListener('click', ()=>{ if(!requireActiveUser()) return; openAdjustModal(stickerById(b.dataset.adjust)); }));
}

function openStickerModal(existing, opts){

  let stickerModalImage = existing?.imageUrl || '';
  openModal(`
    <div class="modal-head"><h3>${isEdit?'แก้ไขรายการสติ๊กเกอร์':'รายการสินค้าใหม่ (สติ๊กเกอร์แบบใหม่)'}</h3>
      <button class="btn btn-ghost btn-icon" data-close-modal>${icon('close',16)}</button></div>
    <div class="modal-body">
      ${!isEdit?`<div class="section-desc" style="margin-top:-4px;">สติ๊กเกอร์แบบใหม่ที่ไม่อยู่ในแคตตาล็อกเดิม ต้องระบุ <b>ขนาด</b> และ <b>จำนวนดวงต่อแผ่น</b> เพื่อให้ระบบคำนวณการรับ/เบิกเป็นแผ่นได้ถูกต้อง (รหัสอ้างอิงตามตารางสติ๊กเกอร์ที่ให้ไว้ เช่น B04, K01 — ดูทั้งหมดได้ที่หน้าตั้งค่า/ข้อมูลอ้างอิง)</div>`:''}
      <div class="field">
        <label>รูปตัวอย่างสติ๊กเกอร์ (ถ้ามี)</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <div id="f_image_preview" tabindex="0" title="วางรูปที่ Capture หน้าจอ (Ctrl+V) หรือลากไฟล์รูปมาวางตรงนี้ได้" style="width:64px;height:64px;border-radius:8px;border:1px dashed var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;cursor:pointer;outline:none;">
            ${stickerModalImage? `<img src="${esc(stickerModalImage)}" style="width:100%;height:100%;object-fit:cover;">` : icon('stock',24)}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
            <input type="file" accept="image/*" id="f_image_file" class="input" style="padding:6px;">
            <div class="subtle" style="font-size:11.5px;">คลิกที่กรอบรูปแล้วกด Ctrl+V เพื่อวางรูปที่ Capture หน้าจอ หรือลากไฟล์มาวางก็ได้</div>
            <button type="button" class="btn btn-ghost btn-sm" id="f_image_remove" style="align-self:flex-start;${stickerModalImage?'':'display:none;'}">${icon('trash',13)}ลบรูป</button>
          </div>
        </div>
      </div>
      <div class="field"><label>ชื่อลายสติ๊กเกอร์ *</label><input class="input" id="f_name" value="${esc(existing?.name||'')}" placeholder="เช่น Brazil Cerrado"></div>
      <div class="field-row3">
        <div class="field"><label>รหัส (ตามตารางอ้างอิง)</label><input class="input" id="f_code" value="${esc(existing?.code||'')}" placeholder="เช่น B04"></div>
        <div class="field"><label>ขนาด (กว้าง×สูง ซม.) *</label><input class="input" id="f_size" value="${esc(existing?.sizeCm||'')}" placeholder="เช่น 12x9.5"></div>
        <div class="field"><label>จำนวนดวงต่อแผ่น *</label><input class="input" id="f_pps" type="number" min="0" value="${existing?.piecesPerSheet??''}" placeholder="เช่น 9"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>จุดสั่งซื้อขั้นต่ำ (จุดวิกฤต, หน่วยดวง)</label><input class="input" id="f_reorder" type="number" min="0" value="${existing?.reorderPoint??0}"></div>
        <div class="field"><label>ราคา/แผ่น (บาท, ไม่รวม VAT)</label><input class="input" id="f_price" type="number" min="0" step="0.01" value="${existing?.pricePerSheet??settings.pricePerSheet}"></div>
      </div>
      <div class="field"><label>ผู้จำหน่ายหลัก</label><input class="input" id="f_supplier" value="${esc(existing?.supplier||settings.printerName||'')}"></div>
      <div class="field"><label>หมายเหตุ</label><textarea class="input" id="f_note" rows="2">${esc(existing?.note||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      ${isEdit?`<button class="btn btn-danger" id="deactivateBtn" style="margin-inline-end:auto;">ปิดการใช้งานรายการนี้</button>`:''}
      <button class="btn btn-ghost" data-close-modal>ยกเลิก</button>
      <button class="btn btn-primary" id="saveStickerBtn">บันทึก</button>
    </div>
  `);
  async function applyStickerModalImage(blobOrFile){
    try{
      const dataUrl = await readImageAsSquareDataUrl(blobOrFile, 240);
      stickerModalImage = dataUrl;
      document.getElementById('f_image_preview').innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
      document.getElementById('f_image_remove').style.display = '';
    }catch(err){ console.error(err); toast('ไม่สามารถอ่านรูปภาพนี้ได้'); }
  }
  document.getElementById('f_image_file').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(file) applyStickerModalImage(file);
  });
  document.getElementById('f_image_remove').addEventListener('click', ()=>{
    stickerModalImage = '';
    document.getElementById('f_image_preview').innerHTML = icon('stock',24);
    document.getElementById('f_image_remove').style.display = 'none';
  });
  // รองรับการวางรูปที่ Capture หน้าจอ (คัดลอกมาแล้วกด Ctrl+V) และการลากไฟล์มาวาง
  const dropzone = document.getElementById('f_image_preview');
  if(opts && opts.focusImage){ setTimeout(()=> dropzone.focus(), 60); }
  function onPaste(e){
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        const blob = item.getAsFile();
        if(blob){ applyStickerModalImage(blob); toast('วางรูปเรียบร้อย'); }
        e.preventDefault();
        break;
      }
    }
  }
  document.addEventListener('paste', onPaste);
  dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.style.borderColor = 'var(--accent)'; });
  dropzone.addEventListener('dragleave', ()=>{ dropzone.style.borderColor = ''; });
  dropzone.addEventListener('drop', e=>{
    e.preventDefault();
    dropzone.style.borderColor = '';
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file && file.type.startsWith('image/')) applyStickerModalImage(file);
  });
  function detachStickerModalPaste(){ document.removeEventListener('paste', onPaste); }
  document.getElementById('modalBox').querySelectorAll('[data-close-modal]').forEach(b=> b.addEventListener('click', detachStickerModalPaste));
  document.getElementById('modalBackdrop').addEventListener('click', function h(e){ if(e.target.id==='modalBackdrop'){ detachStickerModalPaste(); this.removeEventListener('click',h); } });
  document.getElementById('saveStickerBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const sizeCm = document.getElementById('f_size').value.trim();
    const piecesPerSheet = Number(document.getElementById('f_pps').value)||0;
    if(!name){ toast('กรุณากรอกชื่อสติ๊กเกอร์'); return; }
    if(!isEdit && !sizeCm){ toast('กรุณาระบุขนาดของสติ๊กเกอร์แบบใหม่'); return; }
    if(!isEdit && piecesPerSheet<=0){ toast('กรุณาระบุจำนวนดวงต่อแผ่นของสติ๊กเกอร์แบบใหม่'); return; }
    const data = {
      name,
      code: document.getElementById('f_code').value.trim(),
      sizeCm,
      piecesPerSheet,

function exportStockCsv(){
  const stockMap = computeStockMap();
  const rows = [['รหัส','ชื่อสติ๊กเกอร์','ขนาด','ดวง/แผ่น','คงเหลือ(ดวง)','จุดสั่งซื้อ','ราคา/แผ่น','ต้นทุนเฉลี่ยต่อดวง','มูลค่าคงเหลือ','ผู้จำหน่าย']];
  activeStickers().forEach(s=>{
    const st = stockMap[s.id]||{stock:0,avgCost:0};
    rows.push([s.code||'', s.name, s.sizeCm||'', s.piecesPerSheet||'', st.stock, s.reorderPoint||0, s.pricePerSheet||'', st.avgCost.toFixed(2), (st.stock*st.avgCost).toFixed(2), s.supplier||'']);
  });
  downloadCsv(rows, `stock-${todayIso()}.csv`);
}
async function downloadCsv(rows, filename){
  const csv = '﻿'+rows.map(r=> r.map(c=>{
    const s = String(c??'');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  if(downloadsApi){
    try{ await downloadsApi.save({filename, data: csv}); toast('บันทึกไฟล์แล้ว'); return; }
    catch(e){ console.error(e); }
  }
  toast('ไม่สามารถส่งออกไฟล์ได้ในขณะนี้');
}

function estimateReceiveUnitCost(sticker, pieces){
  // Internal-only costing (never shown on the receive form or printed receipt):
  // prefer the price agreed on the referenced PO, else the sticker's master price/sheet,
  // else fall back to the sticker's current average cost so valuation never drops to zero.
  if(!sticker) return 0;
  const poPrice = receivePoRef && receivePoRef.priceById[sticker.id];
  const pricePerSheet = poPrice || Number(sticker.pricePerSheet) || 0;
  const p = pps(sticker);
  if(pricePerSheet>0 && p>0) return pricePerSheet/p;
  const stockMap = computeStockMap();
  return stockMap[sticker.id]?.avgCost || 0;
}
async function submitReceive(){
  if(!requireActiveUser()) return;
  const validLines = receiveLines.filter(l=> l.stickerId && Number(l.qty)>0);
  if(validLines.length===0){ toast('กรุณาเพิ่มรายการสติ๊กเกอร์อย่างน้อย 1 รายการ'); return; }
  const supplier = document.getElementById('r_supplier').value.trim();
  const date = document.getElementById('r_date').value || todayIso();
  const receiver = document.getElementById('r_receiver').value.trim() || getUserName();
  const note = document.getElementById('r_note').value.trim();
  const docNo = nextDocNo('RC','receipts');
  const items = validLines.map(l=>{
    const s = stickerById(l.stickerId);
    const unit = pps(s)>0 ? l.unit : 'PIECE';
    const pieces = receiveLinePieces({...l, unit});
    return {stickerId:l.stickerId, code:s?s.code:'', name:s?s.name:'', unit, enteredQty:Number(l.qty), qty:pieces};
  });
  await addDoc('receipts', {docNo, date, supplier, items, receivedBy:receiver, note, poRef:receivePoRef?.docNo||'', createdAt:nowIso()});
  for(const it of items){
    const s = stickerById(it.stickerId);
    await addDoc('movements', {
      stickerId:it.stickerId, stickerCode:it.code, stickerName:it.name, type:'IN', qty:it.qty,
      unitCost: estimateReceiveUnitCost(s, it.qty),
      enteredUnit:it.unit, enteredQty:it.enteredQty,
      docType:'RECEIPT', docNo, note, by:receiver, at:nowIso(),
    });
  }
  if(receivePoRef?.id){
    await updateDoc('purchaseOrders', receivePoRef.id, {status:'received'});
  }
  toast(`บันทึกใบรับ ${docNo} เรียบร้อย (${items.length} รายการ)`);
  receiveLines = [freshReceiveLine()];
  receivePoRef = null;
  goTo('docs');
  promptAfterSave('receipt', {docNo, date, supplier, items, receivedBy:receiver, note}, 'ตัวอย่างใบรับสินค้า');
}

      if(issueLines.length===0) issueLines=[freshIssueLine()];

    });

}
async function submitIssue(){
  if(!requireActiveUser()) return;
  const validLines = issueLines.filter(l=>l.stickerId && Number(l.qty)>0);
  if(validLines.length===0){ toast('กรุณาเพิ่มรายการสติ๊กเกอร์อย่างน้อย 1 รายการ'); return; }
  const stockMap = computeStockMap();
  const withPieces = validLines.map(l=>{
    const s = stickerById(l.stickerId);
    const unit = pps(s)>0 ? l.unit : 'PIECE';
    return {...l, unit, pieces: issueLinePieces({...l, unit})};
  });
  const overs = withPieces.filter(l=> l.pieces > (stockMap[l.stickerId]?.stock||0));
  if(overs.length>0){
    const ok = await confirmDialog('สต็อกไม่เพียงพอ', 'มีบางรายการที่จำนวนเบิกมากกว่าสต็อกคงเหลือ ต้องการบันทึกต่อหรือไม่? (สต็อกจะติดลบ)');
    if(!ok) return;
  }
  const date = document.getElementById('i_date').value || todayIso();
  const issuer = getUserName();
  const kind = issueKind;
  const refDocNo = kind==='extra' ? (document.getElementById('i_refdoc').value.trim()) : '';
  const docNo = nextDocNo('RQ','requisitions');
  const items = withPieces.map(l=>{
    const s = stickerById(l.stickerId);
    return {stickerId:l.stickerId, code:s?s.code:'', name:s?s.name:'', unit:l.unit, enteredQty:Number(l.qty), qty:l.pieces};
  });
  await addDoc('requisitions', {docNo, date, items, issuedBy:issuer, kind, refDocNo, createdAt:nowIso()});
  for(const it of items){
    await addDoc('movements', {
      stickerId:it.stickerId, stickerCode:it.code, stickerName:it.name, type:'OUT', qty:it.qty,
      enteredUnit:it.unit, enteredQty:it.enteredQty,
      docType:'REQUISITION', docNo, note:'', by:issuer, at:nowIso(),
    });
  }
  toast(`บันทึกใบเบิก ${docNo} เรียบร้อย`);
  issueLines=[freshIssueLine()]; issueKind='normal';
  goTo('docs', {tab:'requisitions'});
  promptAfterSave('requisition', {docNo, date, items, issuedBy:issuer, kind, refDocNo}, 'ตัวอย่างใบเบิก');
}

        <div><label class="li-label">สติ๊กเกอร์</label><select class="select" data-f="stickerId"><option value="">— เลือกสติ๊กเกอร์ —</option>${opts}</select></div>
        <div><label class="li-label">จำนวนแผ่น</label><input class="input" type="number" min="0" data-f="qty" value="${line.qty}" placeholder="0"></div>

        <div><label class="li-label">หมายเหตุ</label><input class="input" data-f="note" value="${esc(line.note||'')}" placeholder="เช่น ลายใหม่"></div>

        <div class="li-remove"><button class="btn btn-ghost btn-icon btn-sm" data-remove-line>${icon('trash',15)}</button></div>
      </div>`;
    }).join('')}
    <div class="line-item-foot">
      <span class="subtle">รวม ${num(sheetsTotal)} แผ่น ${sheetsTotal<settings.moqMin?`· ต่ำกว่า MOQ (${settings.moqMin}-${settings.moqMax})`:''}</span>
      ${subtotal>0?`<span class="total-line">${thb(vatChecked ? subtotal*(1+settings.vatRate) : subtotal)}${vatChecked?' (รวม VAT)':''}</span>`:`<span class="subtle">ยังไม่ระบุราคา</span>`}
    </div>
  `;
  const headerLabel = document.getElementById('po_sheets_header');
  if(headerLabel) headerLabel.textContent = `รวม ${num(sheetsTotal)} แผ่นทั้งหมด`;
  const warnBox = document.getElementById('po_moq_warn');
  if(warnBox){
    warnBox.innerHTML = sheetsTotal>0 && sheetsTotal<settings.moqMin
      ? `<div class="banner">${icon('alert',18)}<div>รวม ${num(sheetsTotal)} แผ่น ต่ำกว่าขั้นต่ำที่โรงพิมพ์กำหนด (${settings.moqMin}-${settings.moqMax} แผ่นต่อครั้ง) ควรเพิ่มรายการก่อนส่งสั่งซื้อจริง</div></div>`
      : '';
  }
  poLines.forEach(line=>{
    const row = wrap.querySelector(`[data-line="${line.key}"]`);
    row.querySelector('[data-f="stickerId"]').value = line.stickerId;
    row.querySelectorAll('[data-f]').forEach(inp=> inp.addEventListener('input', ()=>{
      line[inp.dataset.f]=inp.value;
      if(inp.dataset.f==='stickerId'){
        const s = stickerById(inp.value);
        if(s && s.pricePerSheet && !line.price) line.price = s.pricePerSheet;
      }
      renderPOLines();
    }));
    row.querySelector('[data-remove-line]').addEventListener('click', ()=>{
      poLines = poLines.filter(l=>l.key!==line.key);
      if(poLines.length===0) poLines=[freshPOLine()];
      renderPOLines();
    });
  });
}
async function submitPO(){
  if(!requireActiveUser()) return;
  const validLines = poLines.filter(l=>l.stickerId && Number(l.qty)>0);
  if(validLines.length===0){ toast('กรุณาเพิ่มรายการสติ๊กเกอร์อย่างน้อย 1 รายการ'); return; }
  const settings = getSettings();
  const supplier = document.getElementById('po_supplier').value.trim();
  const contact = document.getElementById('po_contact').value.trim();
  const externalDocNo = document.getElementById('po_external').value.trim();
  const date = document.getElementById('po_date').value || todayIso();
  const expected = document.getElementById('po_expected').value;
  const vatApplied = document.getElementById('po_vat').checked;
  const note = document.getElementById('po_note').value.trim();
  const items = validLines.map(l=>{
    const s = stickerById(l.stickerId);
    const qty=Number(l.qty), unitCost=Number(l.price)||0;
    return {stickerId:l.stickerId, code:s?s.code:'', name:s?s.name:'', qty, unitCost, note:(l.note||'').trim(), amount:qty*unitCost};
  });
  const subtotal = items.reduce((s,i)=>s+i.amount,0);
  const total = vatApplied ? subtotal*(1+settings.vatRate) : subtotal;
  const payload = {date, expectedDate:expected, supplier, contact, externalDocNo, items, subtotal, total, vatApplied, note};
  if(poEditing){
    await updateDoc('purchaseOrders', poEditing.id, payload);
    toast(`บันทึกการแก้ไข ${poEditing.docNo} เรียบร้อย`);
  } else {
    const docNo = nextDocNo('PO','purchaseOrders');
    await addDoc('purchaseOrders', {...payload, docNo, status:'pending', createdBy:getUserName(), createdAt:nowIso()});
    toast(`สร้างใบสั่งซื้อ ${docNo} เรียบร้อย`);
    closeModal();
    renderPO();
    promptAfterSave('po', {...payload, docNo, createdBy:getUserName()}, 'ตัวอย่างใบสั่งซื้อ');
    return;
  }
  closeModal();
  renderPO();
}

let stockCountDate = todayIso();

let stockCountSortDir = 'asc';
function sortedStockCountEntries(){
  const entries = stockCountRows.map(row=> ({row, s: stickerById(row.stickerId)})).filter(x=> !!x.s);
  entries.sort((a,b)=>{
    const askip = !!a.row.skip, bskip = !!b.row.skip;
    if(askip!==bskip) return askip ? 1 : -1;
    const cmp = (a.s.code||'').localeCompare(b.s.code||'');
    return stockCountSortDir==='asc' ? cmp : -cmp;
  });
  return entries;
}
function ensureStockCountRows(){
  if(!stockCountRows){
    stockCountRows = activeStickers().map(s=> ({stickerId:s.id, actual:'', reason:'', skip:!!s.excludeFromCount}));

}

    openPrintPreview(buildStockCountPrintHtml(), {title:'ตัวอย่างใบตรวจนับสต็อค', onPrint:printStockCountSheet, onImage:()=>chooseImageFormat(mode=>saveStockCountImage(mode)), padding:'8mm 10mm'});
  });
  document.getElementById('sc_reset').addEventListener('click', async ()=>{
    const ok = await confirmDialog('เริ่มนับใหม่', 'ต้องการล้างจำนวนที่กรอกไว้ทั้งหมดและเริ่มนับใหม่หรือไม่?');
    if(!ok) return;
    stockCountRows = null; renderStockCount();
  });
  document.getElementById('sc_submit').addEventListener('click', submitStockCount);
  const scSortBtn = document.getElementById('scSortBtn');
  if(scSortBtn) scSortBtn.addEventListener('click', ()=>{ stockCountSortDir = stockCountSortDir==='asc'?'desc':'asc'; renderStockCount(); });
}
function renderStockCountRows(){
  const tbody = document.getElementById('sc_rows');
  const stockMap = computeStockMap();
  tbody.innerHTML = sortedStockCountEntries().map(({row,s})=>{
    const skipped = !!row.skip;
    return `<tr data-row="${row.stickerId}" style="${skipped?'opacity:.5;':''}">
      <td style="text-align:center;"><input type="checkbox" data-f="skip" ${skipped?'checked':''} title="ปิดการนับสติ๊กเกอร์นี้ — จะไม่ขึ้นในใบพิมพ์และเลื่อนลงด้านล่าง"></td>
      <td>${stickerThumbHtml(s,32)}</td>
      <td class="left mono" style="font-size:12px;">${esc(s.code||'-')}</td>
      <td class="left">${esc(s.name)}</td>
      <td class="num">${num(stockMap[s.id]?.stock||0)}</td>
      <td><input class="input" type="number" data-f="actual" value="${row.actual}" placeholder="กรอกจำนวน" style="max-width:120px;" ${skipped?'disabled':''}></td>
      <td data-diffcell class="num">${skipped?'<span class="badge badge-neutral">ข้าม</span>':'-'}</td>
      <td><input class="input" data-f="reason" value="${esc(row.reason)}" placeholder="ระบุสาเหตุถ้าไม่ตรง" ${skipped?'disabled':''}></td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr=>{
    const row = stockCountRows.find(r=>r.stickerId===tr.dataset.row);
    if(!row) return;
    const sys = stockMap[row.stickerId]?.stock || 0;
    const actualInput = tr.querySelector('[data-f="actual"]');
    const reasonInput = tr.querySelector('[data-f="reason"]');
    const skipInput = tr.querySelector('[data-f="skip"]');
    const diffCell = tr.querySelector('[data-diffcell]');
    function updateDiffCell(){
      if(row.skip){ diffCell.innerHTML = '<span class="badge badge-neutral">ข้าม</span>'; return; }
      const hasActual = row.actual!=='' && row.actual!=null;
      const diff = hasActual ? (Number(row.actual)-sys) : null;
      diffCell.innerHTML = !hasActual ? '-' : (diff===0 ? `<span class="badge badge-ok">ตรง</span>` : `<span class="badge ${diff>0?'badge-warning':'badge-critical'}">${diff>0?'+':''}${num(diff)}</span>`);
    }
    updateDiffCell();
    actualInput.addEventListener('input', ()=>{ row.actual = actualInput.value; updateDiffCell(); });
    reasonInput.addEventListener('input', ()=>{ row.reason = reasonInput.value; });
    skipInput.addEventListener('change', async ()=>{
      row.skip = skipInput.checked;
      await updateDoc('stickers', row.stickerId, {excludeFromCount: row.skip});
      renderStockCountRows();
    });
  });
}

  const rows = list.map(s=>`<tr><td style="text-align:center;">${stickerThumbHtml(s,22)}</td><td>${esc(s.code||'-')}</td><td>${esc(s.name)}</td><td style="text-align:center;">${num(stockMap[s.id]?.stock||0)}</td><td style="text-align:center;"></td><td></td></tr>`).join('');
  return `

      <div class="doc-meta"><div class="doc-title-tag">ใบตรวจนับสต็อคสติ๊กเกอร์ (1 แผ่น)</div><div>วันที่นับ: ${thaiDate(stockCountDate)}</div><div>ผู้นับ: ${esc(stockCountCounter||settings.stockCounterName||'-')}</div></div>
    </div>
    <table class="print-table"><thead><tr><th style="text-align:center;">รูป</th><th>รหัส</th><th>รายการ</th><th style="text-align:center;">ระบบ (ดวง)</th><th style="text-align:center;">นับได้จริง (ดวง)</th><th>สาเหตุ (ถ้าไม่ตรง)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sign-grid">${['ผู้นับ','ผู้ตรวจทาน'].map(l=>`<div><div class="sign-line">${l}</div></div>`).join('')}</div>

function printStockCountSheet(){
  document.getElementById('printArea').innerHTML = buildStockCountPrintHtml();
  document.body.classList.add('printing');
  setTimeout(()=>{ window.print(); }, 60);
}
async function saveStockCountImage(mode){
  if(typeof html2canvas==='undefined'){
    toast('ไม่พร้อมใช้งานฟีเจอร์บันทึกรูปภาพในขณะนี้ ลองใช้ปุ่มพิมพ์แทน');
    return;
  }
  const isMobile = mode==='mobile';
  const area = document.getElementById('printArea');
  area.innerHTML = buildStockCountPrintHtml();
  area.classList.toggle('mobile-doc', isMobile);
  document.body.classList.add('capturing');
  await new Promise(r=> setTimeout(r, 80));
  try{
    const canvas = await html2canvas(area, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(!downloadsApi){
      toast('ไม่พบช่องทางบันทึกไฟล์ในเบราว์เซอร์นี้ ลองใช้ปุ่มพิมพ์แทน');
      return;
    }
    const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
    if(!blob){ toast('สร้างรูปภาพไม่สำเร็จ'); return; }
    await downloadsApi.save({filename:`stockcount-${stockCountDate||todayIso()}${isMobile?'-mobile':'-a4'}.png`, data: blob});
    toast('บันทึกรูปภาพเรียบร้อย');
  }catch(e){
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(e && e.code==='declined') return;
    console.error(e);
    toast('เกิดข้อผิดพลาดในการสร้างรูปภาพ');
  }
}
async function submitStockCount(){
  if(!requireActiveUser()) return;
  const stockMap = computeStockMap();
  const withActual = stockCountRows.filter(r=> !r.skip && r.actual!=='' && r.actual!=null && !isNaN(Number(r.actual)));
  if(withActual.length===0){ toast('กรุณากรอกจำนวนที่นับได้อย่างน้อย 1 รายการ'); return; }
  const missingReason = withActual.filter(r=>{
    const sys = stockMap[r.stickerId]?.stock||0;
    const diff = Number(r.actual)-sys;
    return diff!==0 && !r.reason.trim();
  });
  if(missingReason.length>0){
    toast(`กรุณาระบุสาเหตุสำหรับรายการที่นับได้ไม่ตรง (${missingReason.length} รายการ)`);
    return;
  }
  const date = stockCountDate || todayIso();
  const counter = (stockCountCounter||'').trim() || getUserName();
  const docNo = nextStockCountDocNo();
  let adjustedCount = 0;
  for(const r of withActual){
    const s = stickerById(r.stickerId);
    const sys = stockMap[r.stickerId]?.stock || 0;
    const diff = Number(r.actual) - sys;
    if(diff===0) continue;
    adjustedCount++;
    await addDoc('movements', {
      stickerId:r.stickerId, stickerCode:s?s.code:'', stickerName:s?s.name:'', type:'ADJUST', qty:diff,
      docType:'STOCKCOUNT', docNo, note:r.reason.trim(), by:counter, at:nowIso(),
    });
  }
  await saveSettings({lastStockCountAt: date});
  toast(`บันทึกผลนับสต็อค ${docNo} เรียบร้อย (ปรับ ${adjustedCount} รายการ)`);
  stockCountRows = null;
  goTo('dashboard');
}
