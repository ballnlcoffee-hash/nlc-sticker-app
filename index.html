/* ตัวอย่างก่อนพิมพ์ — โชว์หน้าเอกสารในโมดัลก่อน แล้วให้เลือกว่าจะสั่งพิมพ์จริง หรือบันทึกเป็นรูปภาพแทน
   (ใช้เนื้อหา HTML เดียวกับที่จะพิมพ์/แคปเจอร์ทุกประการ ย่อขนาดให้พอดีจอเพื่อดูตัวอย่าง) */
function openPrintPreview(html, {title, onPrint, onImage, padding}={}){
  openModal(`
    <div class="modal-head"><h3>${esc(title||'ตัวอย่างก่อนพิมพ์')}</h3><button class="btn btn-ghost btn-icon" data-close-modal>${icon('close',16)}</button></div>
    <div class="modal-body" style="padding:14px;">
      <div id="pp_scale_wrap" style="overflow:auto;background:#d8d8d8;border-radius:8px;padding:10px;">
        <div id="pp_inner" style="background:#fff;width:210mm;transform-origin:top center;box-shadow:0 2px 14px rgba(0,0,0,.25);margin:0 auto;">
          <div style="font-family:'Prompt',sans-serif;color:#1B1B2F;padding:${padding||'14mm'};">${html}</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close-modal>ปิด</button>
      <button class="btn btn-ghost" id="pp_image">${icon('download',15)}บันทึกเป็นรูปภาพ</button>
      <button class="btn btn-primary" id="pp_print">${icon('print',15)}สั่งพิมพ์</button>
    </div>
  `, {large:true});
  requestAnimationFrame(()=>{
    const wrap = document.getElementById('pp_scale_wrap');
    const inner = document.getElementById('pp_inner');
    if(!wrap || !inner) return;
    const naturalWidth = inner.offsetWidth;
    // จำกัดการย่อไม่ให้เล็กกว่า 62% เพื่อให้ยังอ่านออกบนมือถือจอแคบ — ถ้าเนื้อหากว้างกว่าที่ย่อได้พอดี ให้เลื่อนดูแทนแทนที่จะย่อจนตัวหนังสือเล็กเกินไป
    const scale = naturalWidth ? Math.max(0.62, Math.min(1, (wrap.clientWidth-20) / naturalWidth)) : 1;
    inner.style.transform = `scale(${scale})`;
    inner.style.marginInline = scale*naturalWidth <= wrap.clientWidth-20 ? 'auto' : '0';
    wrap.style.height = Math.ceil(inner.offsetHeight*scale + 20) + 'px';
  });
  document.getElementById('pp_print').addEventListener('click', ()=>{ closeModal(); if(onPrint) onPrint(); });
  document.getElementById('pp_image').addEventListener('click', ()=>{ closeModal(); if(onImage) onImage(); });
}

/* บันทึกเป็นรูปภาพ (PNG) — สำหรับมือถือที่กด "พิมพ์" แล้วไดอะล็อกพิมพ์ของเบราว์เซอร์ใช้งานไม่สะดวก
   ใช้เนื้อหาแบบฟอร์มเดียวกับตอนพิมพ์ทุกประการ แต่ rasterize เป็นภาพแล้วส่งให้ผู้ใช้บันทึก/แชร์แทน */
async function saveDocumentImage(kind, doc, mode){
  if(typeof html2canvas==='undefined'){
    toast('ไม่พร้อมใช้งานฟีเจอร์บันทึกรูปภาพในขณะนี้ ลองใช้ปุ่มพิมพ์แทน');
    return;
  }
  const isMobile = mode==='mobile';
  const area = document.getElementById('printArea');
  area.innerHTML = buildDocPrintHtml(kind, doc);
  area.classList.toggle('mobile-doc', isMobile);
  document.body.classList.add('capturing');
  await new Promise(r=> setTimeout(r, 80));
  try{
    const canvas = await html2canvas(area, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(!downloadsApi){
      toast('ไม่พบช่องทางบันทึกไฟล์ในเบราว์เซอร์นี้ ลองใช้ปุ่มพิมพ์แทน');
      return;
    }
    const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
    if(!blob){ toast('สร้างรูปภาพไม่สำเร็จ'); return; }
    await downloadsApi.save({filename:`${doc.docNo||kind}${isMobile?'-mobile':'-a4'}.png`, data: blob});
    toast('บันทึกรูปภาพเรียบร้อย');
  }catch(e){
    document.body.classList.remove('capturing');
    area.classList.remove('mobile-doc');
    if(e && e.code==='declined') return;
    console.error(e);
    toast('เกิดข้อผิดพลาดในการสร้างรูปภาพ');
  }
}

/* หลังบันทึกเอกสาร (ใบรับ/ใบเบิก/ใบคืน/ใบสั่งซื้อ) — ให้เลือกว่าจะพิมพ์ A4 หรือบันทึกเป็นรูปภาพ
   ถ้าเลือกบันทึกรูปภาพ ให้เลือกต่อว่าจะเอาแบบสำหรับดูในมือถือ หรือแบบสัดส่วน A4 */
function promptAfterSave(kind, doc, title){
  openPrintPreview(buildDocPrintHtml(kind, doc), {
    title: title || 'ตัวอย่างเอกสาร',
    onPrint: ()=> printDocument(kind, doc),
    onImage: ()=> chooseImageFormat(mode=> saveDocumentImage(kind, doc, mode)),
  });
}
function chooseImageFormat(onChoose){
  openModal(`
    <div class="modal-head"><h3>เลือกรูปแบบรูปภาพ</h3><button class="btn btn-ghost btn-icon" data-close-modal>${icon('close',16)}</button></div>
    <div class="modal-body" style="padding:16px;display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-ghost" id="imgfmt_mobile" style="justify-content:flex-start;padding:14px 16px;">
        <div style="text-align:left;"><div style="font-weight:700;">สำหรับมือถือ</div><div class="subtle" style="font-size:12px;">ตัวอักษรใหญ่ อ่านง่ายบนหน้าจอโทรศัพท์ ไม่ต้องซูม</div></div>
      </button>
      <button class="btn btn-ghost" id="imgfmt_a4" style="justify-content:flex-start;padding:14px 16px;">
        <div style="text-align:left;"><div style="font-weight:700;">ขนาด A4</div><div class="subtle" style="font-size:12px;">สัดส่วนตรงกับกระดาษพิมพ์จริง เหมาะสำหรับเก็บ/พิมพ์ภายหลัง</div></div>
      </button>
    </div>
  `);
  document.getElementById('imgfmt_mobile').addEventListener('click', ()=>{ closeModal(); onChoose('mobile'); });
  document.getElementById('imgfmt_a4').addEventListener('click', ()=>{ closeModal(); onChoose('a4'); });
}

/* =========================================================
   INIT
========================================================= */
function initUserName(){
  renderUserSelect();
  document.getElementById('userNameSelect').addEventListener('change', (e)=>{
    try{ localStorage.setItem('nlc_sticker_username', e.target.value); }catch(err){}
  });
}
function applyThemeMode(mode){
  if(mode!=='light' && mode!=='dim' && mode!=='dark') mode = 'light';
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem('nlc_theme_mode', mode); }catch(e){}
  document.querySelectorAll('#themeSwitch [data-theme-opt]').forEach(b=>{
    b.classList.toggle('active', b.dataset.themeOpt===mode);
  });
}
function initThemeSwitch(){
  let mode = 'light';
  try{ const saved = localStorage.getItem('nlc_theme_mode'); if(saved==='light'||saved==='dim'||saved==='dark') mode = saved; }catch(e){}
  applyThemeMode(mode);
  document.querySelectorAll('#themeSwitch [data-theme-opt]').forEach(b=>{
    b.addEventListener('click', ()=> applyThemeMode(b.dataset.themeOpt));
  });
}
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
});
document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
});

onDataChange(()=>{ renderNav(); renderCurrentView(); renderUserSelect(); });
initUserName();
initThemeSwitch();
renderNav();
goTo('dashboard');
initData();

})();
</script>
